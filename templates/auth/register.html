{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow mt-5">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Ro'yxatdan o'tish</h3>
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Ism</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Parol</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="center_name" class="form-label">O'quv markaz nomi</label>
                        <input type="text" class="form-control" id="center_name" name="center_name">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Ro'yxatdan o'tish</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Hisobingiz bormi? <a href="{{ url_for('login') }}">Kirish</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
